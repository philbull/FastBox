site_name: FastBox

theme:
  name: "material"
  features:
    - navigation.expand

plugins:
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_options:
              # Many docstrings name parameters loosely ("lat0, lon0") or omit
              # types; don't let that fail the strict build in CI
              warn_unknown_params: false
              warn_missing_types: false

# Make a broken nav fail the strict build in CI
validation:
  nav:
    omitted_files: warn
    not_found: warn

nav:
  - Home: index.md
  - Code Reference:
      - Box: box.md
      - Beams: beams.md
      - Data analysis: analysis.md
      - Filters: filters.md
      - Forecasting: forecast.md
      - Foregrounds: foregrounds.md
      - Halos: halos.md
      - Inpainting: inpaint.md
      - Noise: noise.md
      - Plot: plot.md
      - Power spectra: power.md
      - Tracers: tracers.md
      - Voids: voids.md
