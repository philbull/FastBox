name: Tests

# Run on every push and on pull requests, so that work on a branch or a fork
# is tested before it reaches main.
on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest Python versions that pyccl publishes wheels for
        python-version: ["3.10", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FastBox and test tools
        run: |
          python -m pip install --upgrade pip
          pip install . pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest fastbox/tests \
                 --cov=fastbox \
                 --cov-config=.coveragerc \
                 --cov-report=term \
                 --cov-report=xml:coverage.xml \
                 --junitxml=test-reports/xunit.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            test-reports/

      # Optional: only does anything once the repository is connected to
      # codecov.io and a CODECOV_TOKEN secret is added. It never fails the run.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
